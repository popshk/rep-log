services:
  master:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ROLE: MASTER
      NODE_ID: master
      PORT: "8080"
      SECONDARIES: http://secondary-1:8080,http://secondary-2:8080
    depends_on:
      - secondary-1
      - secondary-2

  secondary-1:
    build: .
    ports:
      - "8081:8080"
    environment:
      NODE_ROLE: SECONDARY
      NODE_ID: secondary-1
      PORT: "8080"
      REPLICATION_DELAY_MS: "0"

  secondary-2:
    build: .
    ports:
      - "8082:8080"
    environment:
      NODE_ROLE: SECONDARY
      NODE_ID: secondary-2
      PORT: "8080"
      REPLICATION_DELAY_MS: "0"
